version: '3.8'

services:
  # Production-like service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8080:3000"
    env_file:
      - .env.local
    restart: unless-stopped

  # Development service with Hot Module Replacement (HMR)
  dev:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_PORT=3000
    env_file:
      - .env.local

  # Local Agent Context Backend
  context-backend:
    build:
      context: ./local-context-backend
      dockerfile: Dockerfile
    container_name: local-context-backend
    ports:
      - "3001:3000"
    volumes:
      - ~/.gemini:/configs/antigravity:ro
      - ~/.claude:/configs/claude:ro
      - ~/.hermes:/configs/hermes:ro
      - local_context_db:/data
    environment:
      - DATABASE_PATH=/data/context.db
      - PORT=3000
    restart: unless-stopped

volumes:
  local_context_db:
